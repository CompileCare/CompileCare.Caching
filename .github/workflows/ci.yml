name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore HeapCare.Caching.sln
      - name: Build
        run: dotnet build HeapCare.Caching.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test HeapCare.Caching.sln --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/HeapCare.Caching/HeapCare.Caching.csproj --configuration Release --no-build --output artifacts

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack HeapCare Caching
        run: dotnet pack src/HeapCare.Caching/HeapCare.Caching.csproj --configuration Release --output artifacts
      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/HeapCare/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
