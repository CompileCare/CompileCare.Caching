services:
  api:
    build:
      context: .
      dockerfile: samples/HeapCare.Caching.SampleApi/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CacheSettings__UseRedis: "true"
      CacheSettings__RedisConnection: "redis:6379"
    volumes:
      - ./samples/HeapCare.Caching.SampleApi/appsettings.json:/app/appsettings.json

  redis:
    image: redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
